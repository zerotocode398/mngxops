[pytest]
DJANGO_SETTINGS_MODULE = ngxops.settings
python_files = tests.py test_*.py
testpaths = apps
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: unit tests (no database)
    integration: integration tests (requires database)
    e2e: end-to-end browser tests (requires Playwright)