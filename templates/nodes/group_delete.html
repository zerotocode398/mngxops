{% extends "base.html" %}

{% block title %}删除节点组 - ngxops{% endblock %}
{% block page_title %}删除节点组{% endblock %}

{% block content %}
<section class="card" style="max-width:680px"><div class="card-header"><h2 class="h6 mb-0"><i class="bi bi-trash me-1" aria-hidden="true"></i>删除节点组</h2></div><div class="card-body">
    <div class="alert alert-warning">确定删除节点组 <strong>{{ group.name }}</strong> 吗？节点资产不会被删除，组关联会解除。</div>
    <p class="text-muted small">当前组内有 {{ active_count }} 台活跃节点。</p>
    <form method="post" action="/nodes/groups/{{ group.id }}/delete/">{% include "includes/csrf_field.html" %}<div class="d-flex justify-content-between"><a class="btn btn-outline-secondary" href="/nodes/groups/"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>取消</a><button class="btn btn-danger" type="submit"><i class="bi bi-trash me-1" aria-hidden="true"></i>确认删除</button></div></form>
</div></section>
{% endblock %}
