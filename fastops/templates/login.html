<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - MngxOps</title>
    <style>
        body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#111827; }
        .panel { width:min(380px, calc(100vw - 32px)); background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:24px; }
        h1 { margin:0 0 18px; font-size:22px; }
        label { display:block; margin:12px 0 6px; color:#374151; font-size:14px; }
        input { width:100%; box-sizing:border-box; border:1px solid #d1d5db; border-radius:6px; padding:9px 10px; font:inherit; }
        button { width:100%; margin-top:18px; border:0; border-radius:6px; background:#4f46e5; color:#fff; padding:10px; font:inherit; cursor:pointer; }
        .error { background:#fee2e2; color:#991b1b; border-radius:6px; padding:8px 10px; font-size:14px; margin-bottom:10px; }
    </style>
</head>
<body>
<form class="panel" method="post" action="/login">
    <h1>MngxOps 登录</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">登录</button>
</form>
</body>
</html>
